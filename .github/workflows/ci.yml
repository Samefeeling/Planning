name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/loving-cannon-w3j8cq

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check board interactions and crew rules across Australia and New Zealand time zones
        run: |
          TZ=Australia/Sydney npx vitest run tests/features/assemblyBoardView.test.ts tests/store/uiStore.test.ts tests/engine/crew.test.ts
          TZ=Pacific/Auckland npx vitest run tests/features/assemblyBoardView.test.ts tests/store/uiStore.test.ts tests/engine/crew.test.ts
      - run: npm run build
      - run: npm audit --omit=dev
