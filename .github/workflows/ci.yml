name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/loving-cannon-w3j8cq

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Both zones move their clocks on a Sunday, so the shift that gains or
      # loses the hour is never worked — but a schedule that steps over that
      # Sunday must still land on midnight, or every later day inherits the
      # hour. The date and crew-capacity suites are here for that.
      - name: Check board interactions and crew rules across Australia and New Zealand time zones
        run: |
          SUITES="tests/features/assemblyBoardView.test.ts tests/store/uiStore.test.ts tests/engine/crew.test.ts tests/engine/assemblyDates.test.ts tests/engine/crewSchedule.test.ts tests/engine/workload.test.ts tests/features/groupMove.test.ts"
          TZ=Australia/Sydney npx vitest run $SUITES
          TZ=Pacific/Auckland npx vitest run $SUITES
      - run: npm run build
      - run: npm audit --omit=dev
